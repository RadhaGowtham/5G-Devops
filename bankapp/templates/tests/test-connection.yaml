apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "bankapp.fullname" . }}-test-connection"
  labels:
    {{- include "bankapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ .Values.frontend.service.name }}:{{ .Values.frontend.service.port }}']
  restartPolicy: Never

